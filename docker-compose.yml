services:
  api:
    build: .
    image: emed:dev
    ports: ["5156:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=EMed;Username=postgres;Password=postgres;Maximum Pool Size=100;Minimum Pool Size=10"
    depends_on: 
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: EMed
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d EMed"]
      interval: 5s 
      timeout: 5s

  adminer:
    image: adminer:latest
    ports: ["8000:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on: [db]

volumes:
  db-data: {}

networks:
  emed-network:
    driver: bridge
